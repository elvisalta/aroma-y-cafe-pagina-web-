<header class="site-header">

    <!-- Barra superior: redes sociales (izquierda) + acceso al sistema (derecha) -->
    <div class="topbar">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">

            <div class="topbar-redes">
                <a href="#" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.7c0-.93.26-1.56 1.6-1.56h1.7V3.3C16.5 3.2 15.6 3 14.6 3c-2.1 0-3.6 1.3-3.6 3.7v2.1H8.3v3.2h2.7v8h2.5z"/></svg>
                </a>
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2.2c2.7 0 3 0 4.1.06 1 .05 1.6.2 1.9.35.5.2.8.4 1.2.8.4.4.6.7.8 1.2.15.4.3 1 .35 1.9.05 1.1.06 1.4.06 4.1s0 3-.06 4.1c-.05 1-.2 1.6-.35 1.9-.2.5-.4.8-.8 1.2-.4.4-.7.6-1.2.8-.4.15-1 .3-1.9.35-1.1.05-1.4.06-4.1.06s-3 0-4.1-.06c-1-.05-1.6-.2-1.9-.35-.5-.2-.8-.4-1.2-.8-.4-.4-.6-.7-.8-1.2-.15-.4-.3-1-.35-1.9C2.2 15 2.2 14.7 2.2 12s0-3 .06-4.1c.05-1 .2-1.6.35-1.9.2-.5.4-.8.8-1.2.4-.4.7-.6 1.2-.8.4-.15 1-.3 1.9-.35C7.7 3.6 8 3.6 10.7 3.6h1.3zm0 1.8H10.8c-2.6 0-2.9 0-3.9.06-.8.04-1.2.16-1.5.27-.4.15-.6.3-.9.6-.3.3-.5.5-.6.9-.1.3-.23.7-.27 1.5C3.6 8.1 3.6 8.4 3.6 11v2c0 2.6 0 2.9.06 3.9.04.8.16 1.2.27 1.5.15.4.3.6.6.9.3.3.5.5.9.6.3.1.7.23 1.5.27 1 .05 1.3.06 3.9.06h2c2.6 0 2.9 0 3.9-.06.8-.04 1.2-.16 1.5-.27.4-.15.6-.3.9-.6.3-.3.5-.5.6-.9.1-.3.23-.7.27-1.5.05-1 .06-1.3.06-3.9v-2c0-2.6 0-2.9-.06-3.9-.04-.8-.16-1.2-.27-1.5-.15-.4-.3-.6-.6-.9-.3-.3-.5-.5-.9-.6-.3-.1-.7-.23-1.5-.27-1-.05-1.3-.06-3.9-.06z"/><path d="M12 7.4a4.6 4.6 0 100 9.2 4.6 4.6 0 000-9.2zm0 7.6a3 3 0 110-6 3 3 0 010 6zM16.9 6.9a1.08 1.08 0 100 2.16 1.08 1.08 0 000-2.16z"/></svg>
                </a>
            </div>

            <div class="d-flex align-items-center gap-3">

                <a href="{{ url_for('ver_carrito') }}" class="btn-carrito-icono" aria-label="Ver carrito">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/>
                        <circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/>
                        <path d="M2.5 3h2.2l1.9 10.6a2 2 0 0 0 2 1.65h7.8a2 2 0 0 0 1.97-1.65L20 7.5H6"/>
                    </svg>
                    <span id="badgeCarrito" class="badge-carrito {% if not carrito_cantidad %}d-none{% endif %}">{{ carrito_cantidad }}</span>
                </a>

                {% if current_user.is_authenticated %}
                    <div class="dropdown">
                        <button class="btn btn-ingresar dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Panel de {{ current_user.usuario }}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                            <li><a class="dropdown-item" href="{{ url_for('usuarios') }}">Usuarios</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('clientes') }}">Clientes</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('productos') }}">Productos</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('proveedores') }}">Proveedores</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('facturacion') }}">Facturación</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-warning" href="{{ url_for('logout') }}">Cerrar sesión</a></li>
                        </ul>
                    </div>
                {% else %}
                    <!-- AQUÍ ESTÁ EL CAMBIO PARA ABRIR LA VENTANA FLOTANTE -->
                    <a href="#" class="btn btn-ingresar" data-bs-toggle="modal" data-bs-target="#modalLogin">Ingresar Sistema</a>
                {% endif %}

            </div>

        </div>
    </div>

    <!-- Menú principal público -->
    <nav class="navbar navbar-expand-lg main-nav">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <span class="logo-badge">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M17 10.5h1.5a2.5 2.5 0 0 1 0 5H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        <path d="M8 3.5c-.6.6-.6 1.4 0 2s.6 1.4 0 2M12 3.5c-.6.6-.6 1.4 0 2s.6 1.4 0 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="principal">Aroma y Café</span>
                    <span class="secundario">RESTAURANTE &amp; CAFETERÍA</span>
                </span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPublico">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navPublico">
                <ul class="navbar-nav gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('menu') }}">Menú</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('quienes_somos') }}">Quiénes Somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('contacto') }}">Contáctanos</a></li>
                </ul>
            </div>
        </div>
    </nav>

</header>
